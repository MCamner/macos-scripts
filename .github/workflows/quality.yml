name: Quality

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  shell-lint:
    name: Shell syntax check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        run: sudo apt-get install -y zsh

      # Pinned, not apt. ShellCheck's rule set changes between releases, and a
      # gate whose rules move on their own is not reproducible: the first
      # enforced run failed on two SC2120 findings that the version used for the
      # measurement (#92) does not report at all. Bump this deliberately, with
      # the findings the new version brings.
      - name: Install ShellCheck (pinned)
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          tmp="$(mktemp -d)"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - -C "$tmp"
          sudo install -m 0755 "$tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          rm -rf "$tmp"
          shellcheck --version

      - name: Skills are consistent (frontmatter, cross-refs, paths, SKILLS.md)
        run: ./scripts/check-skills.sh

      - name: Runtime authority freeze (no new live -> mqlaunch-v1 edges)
        run: ./scripts/check-runtime-authority.sh

      # One definition of the syntax sweep, called by CI and by
      # release-check.sh alike. This used to be four steps here and a
      # five-file loop in the local gate; the two disagreed about what
      # "shell syntax passes" meant by a factor of fifty.
      - name: Shell syntax (all .sh, routed by shebang)
        run: ./scripts/check-shell-syntax.sh

      # Enforced, and delegated to tools/scripts/lint.sh rather than re-deriving
      # the file list here. The old step had its own `find` with different
      # exclusions, ran `|| true`, and so reported findings nobody read while
      # lint.sh — called by the smoke suite below — was already failing on the
      # same rule. One definition of the surface and the severity.
      #
      # lint.sh exits 0 when shellcheck is absent so a developer without it can
      # still run the suite. That would make this step unfailable, so the binary
      # is installed above and its presence is asserted here.
      - name: ShellCheck (warning severity, enforced)
        run: |
          command -v shellcheck >/dev/null 2>&1 || {
            echo "shellcheck is missing — this gate cannot pass by skipping" >&2
            exit 1
          }
          MACOS_SCRIPTS_HOME="$GITHUB_WORKSPACE" ./tools/scripts/lint.sh

      - name: mqlaunch smoke suite
        run: MACOS_SCRIPTS_HOME="$GITHUB_WORKSPACE" MQ_NO_TUI=1 ./tools/scripts/test-all.sh

  docs-lint:
    name: Markdown lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Same tool and .markdownlint.json config as the pre-commit hook, but
      # WITHOUT --fix, so rules the hook cannot auto-fix (MD040, MD036, ...)
      # fail the build here instead of slipping through silently.
      - name: markdownlint all .md (no auto-fix)
        run: >-
          npx --yes markdownlint-cli "**/*.md"
          --ignore node_modules --ignore backups --ignore .git

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      # The local release gate and CI drifted apart once already: the Python
      # tests and markdownlint ran in CI only, and the local shell syntax check
      # covered five files where this workflow covered 261. Both gates now
      # assert they check the same things.
      - name: Local gate and CI check the same things
        run: python -m pip install pyyaml && python scripts/check-gate-parity.py

      - name: Run B2 TUI tests
        run: python -m pytest mqlaunch/b2_tui/tests
